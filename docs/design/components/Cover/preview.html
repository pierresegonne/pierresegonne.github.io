<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navy & Ember</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;700&family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--night-deep); }
  .night { fill:var(--night); }
  .ember { fill:var(--ember); }
  .glow { fill:none; stroke:var(--ember-glow); stroke-width:2; stroke-linecap:round; }
  .row { stroke:var(--rule); stroke-width:1; }
  .words { position:absolute; left:var(--space-xl); right:var(--space-xl); bottom:var(--space-xl); max-width:440px; }
  .name { margin:0; font-size:96px; line-height:.95; font-weight:300; letter-spacing:1px; color:var(--ink-strong); }
  .tag { margin:var(--space-s) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      night-deep 480×100 bled off top and right (the masthead band) · night 480×80 bled off bottom and right (the footer band) · ember 120×20 once, on the top band (the name — the only accent) — ≈33% of 960×288
  arrangement a strip of unequal horizontal bands: frame top, frame bottom, white reading column between — exactly how every page composes
  pattern     editorial serif, "hairlines, not boxes": three 1px rule lines in the white gap (the post list); plus three ember-glow filaments inside the bands, the frame photo's motif as plain strokes
  scales      band heights 2×space-2xl and space-2xl+space-xl; ember block 6×space-l by space-l; rules space-l+space-xs apart starting space-l in; square corners (the system uses no radius on blocks)
-->
<rect class="deep" x="0" y="0" width="480" height="100"/>
<rect class="ember" x="20" y="30" width="120" height="20"/>
<path class="glow" d="M200 78 C260 62 320 70 380 48 S450 36 480 30"/>
<path class="glow" d="M300 92 C350 86 410 90 480 72"/>
<line class="row" x1="20" y1="130" x2="420" y2="130"/>
<line class="row" x1="20" y1="155" x2="330" y2="155"/>
<line class="row" x1="20" y1="180" x2="380" y2="180"/>
<rect class="night" x="0" y="208" width="480" height="80"/>
<path class="glow" d="M120 266 C180 252 240 260 300 246 S400 238 480 228"/>
</svg>
</div>
<div class="words">
<h1 class="name">Navy &amp;<br>Ember</h1>
<p class="tag">A design outline for my personal site, distilled from pierresegonne.com.</p>
</div>
</div>
</body>
</html>
