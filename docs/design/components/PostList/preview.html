<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PostList — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;700&family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:var(--paper); color:var(--ink); font:18px/1.4 var(--font-serif); }
  .col { max-width:var(--container-max); margin:0 auto; padding:0 var(--space-s) var(--space-m); }
  h1 { font:700 30px/1.7 var(--font-sans); color:var(--ink-max); margin:.75em 0 var(--space-m); }
  .post { border-bottom:1px solid var(--hairline); margin:var(--space-s) 0 0; }
  .post:last-child { border-bottom:none; }
  .meta { font-size:14px; color:var(--ink-muted); }
  h2 { margin:0 0 var(--space-m); font:700 24px/1.7 var(--font-sans); }
  h2 a { color:var(--ink-strong); text-decoration:none; }
  h2 a:hover { color:var(--link-accessible-hover); }
  h2 a:focus-visible { outline:2px solid var(--link-accessible); outline-offset:2px; }
</style></head>
<body><div class="col">
  <h1>Posts</h1>
  <article class="post"><span class="meta">Aug 22, 2025</span><h2><a href="#">A recent post title goes here</a></h2></article>
  <article class="post"><span class="meta">Apr 10, 2024</span><h2><a href="#">A longer title that wraps onto a second line to show how the heading breathes</a></h2></article>
  <article class="post"><span class="meta">Feb 23, 2024</span><h2><a href="#">Short title</a></h2></article>
</div></body></html>
