<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Masthead — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;700&family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:var(--paper); font-family:var(--font-serif); }
  .band { position:relative; overflow:hidden; background:var(--night-deep); }
  .band::before { content:""; position:absolute; inset:0; background:var(--night); opacity:.45; }
  .fil { position:absolute; inset:0; width:100%; height:100%; }
  .fil path { fill:none; stroke:var(--ember-glow); stroke-width:1.5; stroke-linecap:round; }
  .inner { position:relative; max-width:var(--container-max); margin:0 auto; padding:var(--space-l) var(--space-s); display:flex; justify-content:space-between; align-items:flex-start; }
  .name { margin:0; font-family:var(--font-sans); font-weight:300; font-size:28px; line-height:1.7; letter-spacing:1px; color:var(--ember); }
  .tag { margin:calc(-1 * var(--space-xs)) 0 0; font-family:var(--font-sans); font-size:16px; line-height:1.4; color:var(--on-night); }
  nav { margin-top:23px; font-family:var(--font-sans); font-size:18px; }
  nav a { margin-left:var(--space-l); color:var(--nav-on-night); font-weight:300; letter-spacing:1px; text-decoration:none; }
  nav a:focus-visible { outline:2px solid var(--on-night); outline-offset:2px; }
  .label { font:12px/1 var(--font-sans); color:var(--ink-muted); padding:var(--space-s) var(--space-s) 6px; letter-spacing:.5px; text-transform:uppercase; }
  .narrow { width:360px; }
  .narrow .inner { flex-direction:column; align-items:center; text-align:center; }
  .narrow .tag { margin:3px 0; }
  .narrow nav { margin-top:9px; font-size:16px; }
  .narrow nav a { margin:0 var(--space-s); }
</style></head>
<body>
<div class="label">Desktop</div>
<header class="band"><svg class="fil" viewBox="0 0 960 120" preserveAspectRatio="none" aria-hidden="true"><path d="M520 70 C580 52 640 64 700 40 S820 30 900 18"/><path d="M600 96 C660 88 700 98 760 80 S860 74 960 60"/><path d="M380 112 C430 104 470 110 520 98"/><path d="M780 24 C820 20 850 26 890 12"/></svg>
  <div class="inner">
    <div><h1 class="name">Your Name</h1><p class="tag">What you do</p></div>
    <nav><a href="#">Posts</a><a href="#">Talks</a><a href="#">About</a></nav>
  </div>
</header>
<div class="label">≤ 640px</div>
<header class="band narrow"><svg class="fil" viewBox="0 0 960 120" preserveAspectRatio="none" aria-hidden="true"><path d="M520 70 C580 52 640 64 700 40 S820 30 900 18"/><path d="M600 96 C660 88 700 98 760 80 S860 74 960 60"/><path d="M380 112 C430 104 470 110 520 98"/><path d="M780 24 C820 20 850 26 890 12"/></svg>
  <div class="inner">
    <div><h1 class="name">Your Name</h1><p class="tag">What you do</p></div>
    <nav><a href="#">Posts</a><a href="#">Talks</a><a href="#">About</a></nav>
  </div>
</header>
</body></html>
