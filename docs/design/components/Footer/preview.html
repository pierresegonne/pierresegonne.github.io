<style>
  body { margin:0; background:var(--paper); }
  .band { position:relative; overflow:hidden; background:var(--night-deep); border-bottom:1px solid var(--rule); margin-top:var(--space-l); }
  .band::before { content:""; position:absolute; inset:0; background:var(--night); opacity:.6; }
  .fil { position:absolute; inset:0; width:100%; height:100%; }
  .fil path { fill:none; stroke:var(--ember-glow); stroke-width:3; stroke-linecap:round; }
  footer { position:relative; padding:var(--space-l) 0; display:flex; justify-content:center; gap:var(--space-s); }
  footer a { width:32px; height:32px; border-radius:var(--radius-round); background:var(--on-night); display:grid; place-items:center; color:var(--night); }
  footer a:focus-visible { outline:2px solid var(--on-night); outline-offset:2px; }
  footer svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
</style></head>
