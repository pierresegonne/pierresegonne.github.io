<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>GridStatus — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;700&family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:var(--night); font-family:var(--font-sans); color:var(--on-night); }
  .row { display:flex; flex-direction:column; gap:var(--space-s); padding:var(--space-m); }
  .w { display:flex; align-items:center; gap:var(--space-l); }
  .ind { display:flex; flex-direction:column; gap:8px; width:260px; }
  .line { display:flex; gap:8px; align-items:center; }
  .zone { font-size:13px; line-height:1; }
  .lvl { font-size:12px; line-height:1; }
  .dot { width:16px; height:16px; border-radius:var(--radius-round); background:var(--grid-unknown); flex-shrink:0; }
  .pin { width:16px; height:16px; fill:none; stroke:var(--on-night); stroke-width:2; }
  .tog { display:flex; align-items:center; gap:12px; font-size:12px; }
  .track { position:relative; width:50px; height:24px; border-radius:var(--radius-m); background:var(--grid-low); }
  .track::before { content:""; position:absolute; left:29px; bottom:3px; width:18px; height:18px; border-radius:var(--radius-round); background:var(--paper); }
  .track.off { background:var(--grid-unknown); } .track.off::before { left:3px; }
  .low .dot { background:var(--grid-low); } .low .lvl { color:var(--grid-low); }
  .mid .dot { background:var(--grid-medium); } .mid .lvl { color:var(--grid-medium); }
  .high .dot { background:var(--grid-high-dot); } .high .lvl { color:var(--grid-high-dot); }
</style></head>
<body><div class="row">
  <div class="w low"><div class="ind"><div class="line"><svg class="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span class="zone">Copenhagen · DK2</span></div><div class="line"><span class="dot"></span><span class="lvl">Low carbon intensity — full site</span></div></div><div class="tog">GRID-AWARE MODE <span class="track"></span></div></div>
  <div class="w mid"><div class="ind"><div class="line"><svg class="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span class="zone">Berlin · DE</span></div><div class="line"><span class="dot"></span><span class="lvl">Moderate — greyscale, lighter images</span></div></div><div class="tog">GRID-AWARE MODE <span class="track"></span></div></div>
  <div class="w high"><div class="ind"><div class="line"><svg class="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span class="zone">Warsaw · PL</span></div><div class="line"><span class="dot"></span><span class="lvl">High — images hidden</span></div></div><div class="tog">GRID-AWARE MODE <span class="track"></span></div></div>
  <div class="w"><div class="ind"><div class="line"><svg class="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span class="zone">Detecting…</span></div><div class="line"><span class="dot"></span><span class="lvl">Unknown / mode off</span></div></div><div class="tog">GRID-AWARE MODE <span class="track off"></span></div></div>
</div></body></html>
